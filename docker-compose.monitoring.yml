# Feature 16 (Observability) - Part 7, Docker Monitoring Stack.
#
# Runs Prometheus + Grafana ONLY. The 12 MoodMate services are not containerized in this project
# (see start-all.bat) and this file deliberately does not try to change that - it's an independent
# add-on that scrapes the services wherever they're already running (see
# monitoring/prometheus/prometheus.yml's host.docker.internal note).
#
# Usage:
#   docker compose -f docker-compose.monitoring.yml up -d      # start
#   docker compose -f docker-compose.monitoring.yml down       # stop (keeps the grafana-data volume)
#   docker compose -f docker-compose.monitoring.yml down -v    # stop AND wipe stored dashboards/settings
#
# Start this whenever you like relative to the services themselves - Prometheus just shows gaps in
# the graphs for any target that isn't up yet, it doesn't fail to start.
#
# Prometheus:  http://localhost:9090
# Grafana:     http://localhost:3001  (default login admin / admin - Grafana forces a password
#              change on first login; GF_SECURITY_ADMIN_PASSWORD below only sets what that first
#              login form's own password field starts as, it does not skip the change-password step)

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: moodmate-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    networks:
      - moodmate-monitoring
    # Lets prometheus.yml's host.docker.internal targets resolve on Linux Docker Engine too (on
    # Docker Desktop for Windows/Mac this already works without it, but this line is harmless
    # there and makes the compose file portable to Linux hosts without edits).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: moodmate-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000" # host 3001, not 3000 - avoids colliding with a typical local frontend dev server
    networks:
      - moodmate-monitoring

networks:
  moodmate-monitoring:
    name: moodmate-monitoring
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
