server:
  port: ${PORT:8080}

spring:
  application:
    name: moodmate-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/moodmate}
    username: ${DB_USERNAME:moodmate}
    password: ${DB_PASSWORD:moodmate}

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    ignore-missing-migrations: true

  jackson:
    time-zone: UTC

moodmate:
  jwt:
    # 32+ char secret required by the HS256 signer in JwtService - override via env in every
    # real environment. This default only exists so a local `mvn spring-boot:run` doesn't crash
    # before you've set anything up - do not ship it.
    secret: ${JWT_SECRET:dev-only-secret-change-me-before-deploy-32chars-min}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}

  tree:
    xp-max: 700

  paystack:
    base-url: https://api.paystack.co
    secret-key: ${PAYSTACK_SECRET_KEY:}
    public-key: ${PAYSTACK_PUBLIC_KEY:}
    callback-url: ${PAYSTACK_CALLBACK_URL:moodmate://payment-callback}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

logging:
  level:
    com.moodmate.backend: INFO
