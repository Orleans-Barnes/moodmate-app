server:
  port: ${PORT:8080}
  # Trust the X-Forwarded-Proto header set by Render's load balancer so Spring
  # sees https:// as the scheme — required for correct redirect URLs and HSTS.
  forward-headers-strategy: native

spring:
  application:
    name: moodmate-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/moodmate}
    username: ${DB_USERNAME:moodmate}
    password: ${DB_PASSWORD:moodmate}

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    time-zone: UTC

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

moodmate:
  jwt:
    # Must be 32+ chars. Generate with: openssl rand -base64 48
    # NEVER deploy without setting JWT_SECRET env var — the fallback is for local dev only.
    secret: ${JWT_SECRET:dev-only-secret-change-me-before-deploy-32chars-min}
    # 8 hours — short enough to limit stolen-token window, long enough for normal sessions.
    # Override with JWT_EXPIRATION_MINUTES env var if needed.
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}

  tree:
    xp-max: 700

  paystack:
    base-url: https://api.paystack.co
    secret-key: ${PAYSTACK_SECRET_KEY:}
    public-key: ${PAYSTACK_PUBLIC_KEY:}
    callback-url: ${PAYSTACK_CALLBACK_URL:moodmate://payment-callback}

  cors:
    # IMPORTANT: set CORS_ALLOWED_ORIGINS to your exact frontend origin before deploying.
    # Example: https://moodmate.app
    # Wildcard (*) is only acceptable for local development.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

  uploads:
    # Local disk storage for dev. In production on Render, override with UPLOADS_PATH
    # pointing to a persistent volume — or migrate to S3/Cloudinary before launch.
    path: ${UPLOADS_PATH:./uploads}

groq:
  # Groq API base URL — paths are appended per method in GroqClient
  base-url: https://api.groq.com
  # REQUIRED — set the GROQ_API_KEY environment variable before starting.
  # Windows:  set GROQ_API_KEY=gsk_xxxx  then  mvnw spring-boot:run
  # macOS/Linux: export GROQ_API_KEY=gsk_xxxx && ./mvnw spring-boot:run
  # If missing, AI features will return fallback responses (no crash).
  api-key: ${GROQ_API_KEY:MISSING_SET_GROQ_API_KEY}
  # Chat model (fast free-tier)
  model: ${GROQ_MODEL:llama-3.1-8b-instant}
  # Vision model for image analysis
  vision-model: ${GROQ_VISION_MODEL:meta-llama/llama-4-scout-17b-16e-instruct}
  # Whisper model for audio transcription
  whisper-model: ${GROQ_WHISPER_MODEL:whisper-large-v3-turbo}

management:
  endpoints:
    web:
      exposure:
        # Expose only the health check — all other actuator endpoints are disabled.
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.moodmate.backend: INFO
