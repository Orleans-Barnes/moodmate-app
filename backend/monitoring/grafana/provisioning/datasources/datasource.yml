# Feature 16 (Observability) - auto-provisions Prometheus as Grafana's datasource on container
# startup, so there's no manual "Add data source" click-through needed after `docker compose up`.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # "prometheus" resolves via the Docker network both containers share - see
    # docker-compose.monitoring.yml (service name "prometheus", same compose file/network).
    url: http://prometheus:9090
    isDefault: true
    editable: false
