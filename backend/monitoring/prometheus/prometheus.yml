# Feature 16 (Observability) - Part 5, centralized Prometheus scrape configuration.
#
# Target host: host.docker.internal. This monitoring stack runs Prometheus/Grafana in Docker
# (see ../docker-compose.monitoring.yml), but the 12 MoodMate services themselves are NOT
# containerized in this project - they run directly on the host via start-all.bat/mvnw
# spring-boot:run (see that script's own comments). host.docker.internal is Docker Desktop's
# built-in DNS name for "the machine Docker is running on" and works out of the box on Windows/Mac
# Docker Desktop, which is what this project's tooling (start-all.bat, TEAM_SETUP_GUIDE.md)
# assumes. If this stack is ever moved to Linux Docker Engine (no Docker Desktop) or the services
# are containerized later, replace host.docker.internal with the appropriate service DNS names or
# the gateway's extra_hosts mapping - see docker-compose.monitoring.yml's comment.
#
# Job naming: the feature spec names some services this project doesn't have as separate
# deployables (User Service, Counsellor Service, Notification Service, Payment/Billing Service) -
# in this codebase those live inside existing services (user profile -> moodmate-auth, counsellor
# booking -> moodmate-support, push notifications -> moodmate-auth's PushController, billing ->
# moodmate-wallet's PaymentsService). Job names below use this project's actual module names so
# they line up with logging.pattern.console's ${spring.application.name} value and with
# management.endpoints.web.exposure in each service's application.yml, rather than inventing
# services that don't exist.

global:
  scrape_interval: 15s # sensible default for a dev/small-deployment topology - frequent enough
                        # for the Grafana dashboards' 5m/1h windows to look live, not so frequent
                        # it meaningfully loads 12 JVMs scraped from a single Prometheus instance.
  evaluation_interval: 15s
  external_labels:
    monitor: "moodmate"

scrape_configs:
  - job_name: "moodmate-gateway"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels: { service: "gateway" }

  - job_name: "moodmate-auth"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8091"]
        labels: { service: "auth" }

  - job_name: "moodmate-mood"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8092"]
        labels: { service: "mood" }

  - job_name: "moodmate-support"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8093"]
        labels: { service: "support" }

  - job_name: "moodmate-community"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8094"]
        labels: { service: "community" }

  - job_name: "moodmate-wellness"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8095"]
        labels: { service: "wellness" }

  - job_name: "moodmate-wallet"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8096"]
        labels: { service: "wallet" }

  - job_name: "moodmate-journal"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8097"]
        labels: { service: "journal" }

  - job_name: "moodmate-gamification"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8098"]
        labels: { service: "gamification" }

  - job_name: "moodmate-admin"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8099"]
        labels: { service: "admin" }

  - job_name: "moodmate-crisis"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8100"]
        labels: { service: "crisis" }

  - job_name: "moodmate-ai"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8101"]
        labels: { service: "ai" }
