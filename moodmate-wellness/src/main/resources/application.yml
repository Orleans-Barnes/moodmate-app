server:
  port: ${PORT:8095}

spring:
  application:
    name: moodmate-wellness
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/moodmate?currentSchema=wellness}
    username: ${DB_USERNAME:moodmate}
    password: ${DB_PASSWORD:moodmate}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_schema: wellness
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: wellness
    default-schema: wellness
    create-schemas: true
    baseline-on-migrate: true
    ignore-missing-migrations: true
  jackson:
    time-zone: UTC

moodmate:
  tree:
    xp-max: 700
    # Placeholder - see config/TreeProperties.java doc comment. Confirm the real reward amount
    # with product before this reaches real users.
    leaf-reward-per-day: ${LEAF_REWARD_PER_DAY:10}
    # Placeholder cost for POST /api/wellness/streak/shield - same "confirm with product" caveat
    # as leaf-reward-per-day above.
    streak-shield-cost-leaves: ${STREAK_SHIELD_COST_LEAVES:50}
    # Feature 14 (Shop Improvements) - POST /api/wellness/boosts/double-xp. Matches the frontend's
    # ShopScreen.tsx "Double XP (24h)" boost tile (40 leaves, 24h) - same "confirm with product"
    # placeholder caveat as the other costs above.
    double-xp-cost-leaves: ${DOUBLE_XP_COST_LEAVES:40}
    double-xp-duration-hours: ${DOUBLE_XP_DURATION_HOURS:24}

  habits:
    # Default XP a newly-created habit awards per completion (see HabitProperties.java). Each
    # habit stores its own value after creation, so changing this only affects future habits.
    default-xp-per-completion: ${HABIT_XP_PER_COMPLETION:10}

  services:
    # Direct (non-gateway) service-to-service address for wallet-service.
    wallet-base-url: ${WALLET_SERVICE_URL:http://localhost:8096}

# Feature 15 (Production Hardening) - Circuit Breaker for WalletServiceClient.getSummary(), the
# most-called method in this service (every state read and every goal toggle). Same
# settings/rationale as moodmate-ai's identical "walletService" breaker config.
resilience4j:
  circuitbreaker:
    instances:
      walletService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

management:
  endpoints:
    web:
      exposure:
        # Feature 16 (Observability) - Part 3/5. metrics: auto-recorded JVM/process/
        # http.server.requests/HikariCP-pool metrics, no code needed. prometheus: scrape endpoint
        # for monitoring/prometheus/prometheus.yml (needs micrometer-registry-prometheus, added in
        # pom.xml). See root OBSERVABILITY.md for the "unauthenticated, same as health/info
        # already were" caveat.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    distribution:
      # Feature 16 (Observability) - Part 9, Performance Monitoring (P95/P99 latency). Client-side
      # computed percentile gauges (not full histogram buckets - that's the lighter-weight of the
      # two options Micrometer supports, and enough for the Grafana "API Monitoring" dashboard's
      # p95/p99 panels; histogram buckets would additionally allow server-side aggregation across
      # multiple instances of the *same* service in Prometheus, which this single-instance-per-
      # service topology doesn't need).
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99

logging:
  pattern:
    # Feature 16 (Observability) - Part 2, Structured Logging. Timestamp, level, service name,
    # thread, correlation ID (via CorrelationIdFilter's MDC entry, key "correlationId" - see that
    # class's doc comment), logger class, message. CorrelationIdFilter itself logs
    # "METHOD /uri completed STATUS in N ms" as %msg for every request, satisfying this feature's
    # request-logging requirement without a second filter.
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [${spring.application.name}] [%thread] [correlationId=%X{correlationId:-}] %logger{36} - %msg%n"
  level:
    com.moodmate.wellness: INFO
